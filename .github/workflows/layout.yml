name: Capture desktop and phone layouts

on:
  push:
    branches: [main, 'review/**']
    paths:
      - 'src/**'
      - 'tests/tour.spec.ts'
      - 'tests/improvements.spec.ts'
      - 'tests/slides.spec.ts'
      - '.github/workflows/layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-captures
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/tour.spec.ts tests/improvements.spec.ts tests/slides.spec.ts --grep 'responsive layout, image assets|Album source clarity|archival photo can zoom|eras restore their selected|source drawer separates|compact info access|new scenes accessible|Canva presentation' --workers=1
        env:
          MUA_DO_CAPTURE_LAYOUTS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: layout-captures
          path: test-results/
          if-no-files-found: error
          retention-days: 7
